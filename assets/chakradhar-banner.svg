<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Chakradhar Tode — Digital Builder</title>
  <desc id="desc">A midnight-indigo and teal abstract banner with geometric orbit lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1b"/>
      <stop offset=".55" stop-color="#17143a"/>
      <stop offset="1" stop-color="#063c46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="250" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" opacity=".45">
    <ellipse cx="1000" cy="170" rx="260" ry="92" transform="rotate(-28 1000 170)" stroke-width="2"/>
    <ellipse cx="1000" cy="170" rx="205" ry="140" transform="rotate(35 1000 170)" stroke-width="1.5"/>
    <circle cx="1000" cy="170" r="115" stroke-dasharray="5 12" stroke-width="2"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="823" cy="68" r="5"/><circle cx="1115" cy="225" r="7"/>
  </g>
  <g fill="#2dd4bf"><circle cx="970" cy="38" r="5"/><circle cx="900" cy="275" r="4"/></g>
  <path d="M70 77h48" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="151" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-1">CHAKRADHAR TODE</text>
  <text x="73" y="198" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="4">STUDENT  /  DIGITAL BUILDER</text>
  <text x="73" y="250" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">Curiosity into skills. Ideas into projects.</text>
  <text x="73" y="305" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">GITHUB.COM/CHAKRADHARTODE</text>
</svg>
